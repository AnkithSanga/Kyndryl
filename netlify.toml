# Netlify configuration for Kyndryl Banking Assistant
# Deploys React frontend + Python Flask backend using Railpack

[build]
# Build frontend and prepare backend for serverless deployment
command = "cd frontend && npm install && npm run build"
# Directory to deploy (React build output)
publish = "frontend/build"
# Functions directory for serverless backend
functions = "netlify/functions"

# Environment variables for build
[build.environment]
NODE_VERSION = "18"
PYTHON_VERSION = "3.11"
PIP_CACHE_DIR = ".cache/pip"

# Ignore commands - don't rebuild on these file changes
[build.ignore]
command = "git diff --quiet HEAD~1 frontend/"

# Dev server configuration
[dev]
# Frontend dev server
command = "cd frontend && npm start"
port = 3000
targetPort = 3000

# API redirects - route all /api/* to serverless backend functions
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

# Single page app rewrite (everything else goes to index.html)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache control headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

# Netlify Edge Functions - optional performance enhancement
[edge_functions]

# Development environment
[env.development]
[env.development.build.environment]
API_BASE_URL = "http://localhost:3000"
FLASK_ENV = "development"

# Production environment
[env.production]
[env.production.build.environment]
API_BASE_URL = "https://kyndryl-banking-assistant.netlify.app"
FLASK_ENV = "production"
